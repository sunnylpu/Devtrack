apiVersion: v1
kind: ConfigMap
metadata:
  name: devtrack-config
  namespace: devtrack
data:
  NODE_ENV: "production"
  PORT: "5001"
  MONGO_URI: "mongodb://mongodb.devtrack.svc.cluster.local:27017/devtrack_pro"
  REDIS_URL: "redis://redis.devtrack.svc.cluster.local:6379"
  FRONTEND_URL: "http://devtrack.local"
  GITHUB_CALLBACK_URL: "http://devtrack.local/api/github/callback"
  JWT_EXPIRES_IN: "15m"
  JWT_REFRESH_EXPIRES_IN: "7d"
---
apiVersion: v1
kind: Secret
metadata:
  name: devtrack-secret
  namespace: devtrack
type: Opaque
stringData:
  JWT_SECRET: "change_this_to_a_secure_random_jwt_secret_in_production"
  JWT_REFRESH_SECRET: "change_this_to_a_secure_random_refresh_secret_in_production"
  OPENAI_API_KEY: ""
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
  GITHUB_TOKEN: ""
